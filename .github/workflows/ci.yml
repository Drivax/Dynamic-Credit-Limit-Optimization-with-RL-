name: tests
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,experiments,rl]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=credit_rl --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - run: python -m credit_rl.experiments.main_evaluation --profile smoke
