population:
  seed: 73000
  train: 1500
  validation: 100
  test: 300
  oot: 300
pd_model: outputs/models/pd/logistic_calibrated.joblib
guardrails:
  severe_delinquency_months: 3
risk_constraints:
  # Experimental alerts, not regulatory limits; never used to tune final test.
  high_pd: 0.6
  max_default_rate: 0.75
  max_credit_loss_rate: 0.7
  max_high_risk_exposure_share: 0.6
heuristics:
  low_pd: 0.2
  high_pd: 0.6
  utilization_threshold: 0.75
  # Validation-only alternatives; score is mean discounted training objective.
  threshold_candidates: [[0.1, 0.5], [0.2, 0.6], [0.3, 0.7]]
ppo:
  seeds: [101, 202, 303, 404, 505]
  total_timesteps: 32768
  pilot_timesteps: 4096
  validation_every: 8192
  gamma: 0.98
  learning_rate: 0.0003
  gae_lambda: 0.95
  clip_range: 0.2
  n_steps: 512
  batch_size: 128
  n_epochs: 5
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  network: [64, 64]
  # Fixed unit conversion EUR -> kEUR; no adaptive reward/observation normalization.
  reward_scale: 0.001
  candidates:
    - {learning_rate: 0.0003, ent_coef: 0.01}
    - {learning_rate: 0.0001, ent_coef: 0.02}
evaluation:
  bootstrap_repetitions: 300
  bootstrap_seed: 73100
  macro_scenarios: [baseline, mild_stress, severe_stress, recovery]
  sensitivity_pd_multiplier: 0.5
  oracle_draws: 12
