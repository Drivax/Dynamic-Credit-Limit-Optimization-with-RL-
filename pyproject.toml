[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-rl"
version = "1.0.0"
description = "Longitudinal credit-limit decision simulation for research"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Alexl"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "gymnasium>=0.29,<2", "PyYAML>=6"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9", "scikit-learn>=1.5", "joblib>=1.4", "scipy>=1.11", "threadpoolctl>=3"]
rl = ["stable-baselines3==2.9.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[tool.setuptools]
license-files = ["LICENSE", "docs/third_party_notices.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
extend-exclude = ["experiments/legacy"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.coverage.run]
source = ["credit_rl"]

[tool.coverage.report]
show_missing = true
